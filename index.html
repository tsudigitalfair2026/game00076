<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PENGUIN MEMORY MASTER</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    background:
    radial-gradient(circle at top,#53c8ff,#071a36 70%);
    color:#fff;
}

.screen{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:14px;
}

.active{
    display:flex;
}

.panel{
    width:100%;
    max-width:500px;
    background:rgba(0,0,0,.35);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:24px;
    padding:22px;
    text-align:center;
    box-shadow:
    0 0 20px rgba(83,200,255,.35),
    0 0 60px rgba(83,200,255,.15);
}

.title{
    font-size:clamp(28px,6vw,46px);
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:14px;
    text-shadow:0 0 15px #53c8ff;
}

.subtitle{
    color:#cfefff;
    line-height:1.8;
    font-size:15px;
}

.btn{
    width:100%;
    min-height:62px;
    border:none;
    border-radius:18px;
    margin-top:18px;
    font-size:22px;
    font-weight:800;
    color:#fff;
    cursor:pointer;
    background:linear-gradient(135deg,#00bfff,#0066ff);
    box-shadow:
    0 5px 20px rgba(0,150,255,.5);
}

.btn:active{
    transform:scale(.98);
}

#gameScreen{
    justify-content:flex-start;
}

#hud{
    width:100%;
    max-width:520px;
    display:flex;
    justify-content:space-between;
    margin-top:10px;
    margin-bottom:12px;
    gap:10px;
}

.hudBox{
    flex:1;
    background:rgba(0,0,0,.35);
    border-radius:16px;
    text-align:center;
    padding:10px;
    border:1px solid rgba(255,255,255,.15);
}

.hudLabel{
    font-size:12px;
    color:#a8dcff;
}

.hudValue{
    font-size:26px;
    font-weight:900;
}

#board{
    width:100%;
    max-width:520px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.card{
    aspect-ratio:1/1;
    border-radius:18px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    cursor:pointer;
    user-select:none;
    transition:.25s;

    background:
    linear-gradient(135deg,#005eff,#00d4ff);

    color:transparent;

    box-shadow:
    inset 0 2px 8px rgba(255,255,255,.3),
    0 5px 12px rgba(0,0,0,.3);
}

.card.open{
    background:white;
    color:black;
    transform:scale(1.05);
}

.card.matched{
    background:linear-gradient(135deg,#00ff95,#4dff4d);
    color:black;
    animation:pop .3s;
}

@keyframes pop{
    0%{transform:scale(.8);}
    100%{transform:scale(1);}
}

#resultScore{
    font-size:38px;
    font-weight:900;
    margin:15px 0;
}

#rank{
    font-size:42px;
    font-weight:900;
    margin-bottom:10px;
}

.rankS{
    color:#ffe44d;
    text-shadow:0 0 20px gold;
}

.rankA{
    color:#6dff7a;
}

.rankB{
    color:#8dd8ff;
}

.rankC{
    color:#ffffff;
}

.message{
    margin-top:8px;
    color:#d6efff;
}

@media(max-width:420px){
    .card{
        font-size:34px;
    }
}
</style>
</head>

<body>

<div id="startScreen" class="screen active">
    <div class="panel">
        <div class="title">🐧 PENGUIN MEMORY MASTER</div>

        <div class="subtitle">
            同じ絵柄を2枚見つけてそろえよう！<br>
            制限時間は100秒！<br>
            全部そろえると完全クリア！<br>
            高スコアでSランクを目指そう！
        </div>

        <button class="btn" id="startBtn">
            ▶ START
        </button>
    </div>
</div>

<div id="gameScreen" class="screen">

    <div id="hud">

        <div class="hudBox">
            <div class="hudLabel">SCORE</div>
            <div class="hudValue" id="score">0</div>
        </div>

        <div class="hudBox">
            <div class="hudLabel">TIME</div>
            <div class="hudValue" id="time">100</div>
        </div>

    </div>

    <div id="board"></div>

</div>

<div id="resultScreen" class="screen">

    <div class="panel">

        <div class="title">RESULT</div>

        <div id="resultScore">0</div>

        <div id="rank">C</div>

        <div class="message" id="resultMessage"></div>

        <button class="btn" id="restartBtn">
            🔄 PLAY AGAIN
        </button>

    </div>

</div>

<script>

const board=document.getElementById("board");
const scoreEl=document.getElementById("score");
const timeEl=document.getElementById("time");

const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const resultScreen=document.getElementById("resultScreen");

const resultScore=document.getElementById("resultScore");
const rankEl=document.getElementById("rank");
const resultMessage=document.getElementById("resultMessage");

const icons=[
"🐧","🐧",
"🐥","🐥",
"🐟","🐟",
"🧊","🧊",
"❄️","❄️",
"🌊","🌊",
"⭐","⭐",
"🎿","🎿"
];

let score=0;
let time=100;
let timer;
let first=null;
let second=null;
let lock=false;
let matched=0;

function screen(target){
    [startScreen,gameScreen,resultScreen]
    .forEach(s=>s.classList.remove("active"));

    target.classList.add("active");
}

function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }
}

function createBoard(){

    board.innerHTML="";

    const data=[...icons];
    shuffle(data);

    data.forEach(icon=>{

        const card=document.createElement("div");
        card.className="card";
        card.dataset.icon=icon;
        card.textContent=icon;

        card.addEventListener("click",()=>{
            openCard(card);
        });

        board.appendChild(card);

    });

}

function openCard(card){

    if(lock) return;
    if(card.classList.contains("open")) return;
    if(card.classList.contains("matched")) return;

    card.classList.add("open");

    if(!first){
        first=card;
        return;
    }

    second=card;
    lock=true;

    if(first.dataset.icon===second.dataset.icon){

        first.classList.add("matched");
        second.classList.add("matched");

        score+=150;
        matched++;

        scoreEl.textContent=score;

        first=null;
        second=null;
        lock=false;

        if(matched===8){
            finish(true);
        }

    }else{

        setTimeout(()=>{

            first.classList.remove("open");
            second.classList.remove("open");

            first=null;
            second=null;
            lock=false;

        },600);

    }

}

function startGame(){

    clearInterval(timer);

    score=0;
    time=100;
    matched=0;
    first=null;
    second=null;
    lock=false;

    scoreEl.textContent=score;
    timeEl.textContent=time;

    createBoard();

    screen(gameScreen);

    timer=setInterval(()=>{

        time--;

        timeEl.textContent=time;

        if(time<=0){
            finish(false);
        }

    },1000);

}

function finish(clear){

    clearInterval(timer);

    resultScore.textContent="🏆 "+score;

    let rank="C";
    let msg="また挑戦しよう！";

    if(score>=1200){
        rank="S";
        msg="伝説のペンギンマスター！";
    }
    else if(score>=900){
        rank="A";
        msg="すばらしい記憶力！";
    }
    else if(score>=600){
        rank="B";
        msg="かなり上手！";
    }

    rankEl.textContent=rank;
    rankEl.className="";

    if(rank==="S") rankEl.classList.add("rankS");
    if(rank==="A") rankEl.classList.add("rankA");
    if(rank==="B") rankEl.classList.add("rankB");
    if(rank==="C") rankEl.classList.add("rankC");

    if(clear){
        resultMessage.textContent="🎉 全ペア発見！完全クリア！";
    }else{
        resultMessage.textContent=msg;
    }

    screen(resultScreen);
}

document.getElementById("startBtn")
.addEventListener("click",startGame);

document.getElementById("restartBtn")
.addEventListener("click",startGame);

document.addEventListener("gesturestart",e=>{
    e.preventDefault();
});

document.addEventListener("dblclick",e=>{
    e.preventDefault();
},{passive:false});

</script>

</body>
</html>
